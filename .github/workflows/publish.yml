name: Publish Python Package

on:
  # release:
  #   types: [created]
  push:
    branches:
      - master
    paths:
      - 'pyproject.toml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'poetry'
      - name: Setup dependencies
        run: make install
      - name: Tests
        run: make test
  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v5
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'poetry'
      - name: Setup dependencies
        run: poetry install --no-interaction --only main
      - name: Configure PyPI token
        run: poetry config pypi-token.pypi ${{ secrets.PYPI_TOKEN }}
      - name: Publish
        run: make publish
