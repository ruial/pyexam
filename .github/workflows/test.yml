name: Test

on:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install poetry
        run: pipx install poetry
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'poetry'
      - name: Setup dependencies
        run: make install
      - name: Linting
        run: make lint
      - name: Tests and coverage
        run: make coverage
